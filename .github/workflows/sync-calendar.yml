name: Sync iCloud Calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch iCal feed
        run: |
          curl -sL -o booking/calendar.ics.tmp "https://p129-caldav.icloud.com/published/2/MjY5NzY1MDk4MjY5NzY1MMuK0ACHkdpc5GygDGb6-2DYU406dc50UWBLnFyTBofK-qLrJXmFOQDbIFCHnXQKwA46Ads2FlXBo0s1yNZee2Q"

      - name: Validate ICS file
        run: |
          if ! head -c 15 booking/calendar.ics.tmp | grep -q "BEGIN:VCALENDAR"; then
            echo "Downloaded file is not a valid ICS feed, aborting."
            cat booking/calendar.ics.tmp
            exit 1
          fi
          mv booking/calendar.ics.tmp booking/calendar.ics

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking/calendar.ics
          if git diff --staged --quiet; then
            echo "No changes to calendar."
          else
            git commit -m "Sync calendar.ics"
            git push
          fi
